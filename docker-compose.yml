services:
  finance-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3050}:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=change-this-to-a-secure-random-secret-string-32-chars
      - DATABASE_PATH=/app/data/finance.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/auth/me').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
